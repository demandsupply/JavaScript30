<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Whack A Mole!</title>
    <link
      href="https://fonts.googleapis.com/css?family=Amatic+SC:400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="https://fav.farm/🔥" />
  </head>
  <body>
    <h1>
      Whack-a-mole! <span class="score">0</span> <span class="time"></span>
    </h1>
    <button onClick="startGame()">Start!</button>

    <div class="game">
      <div class="hole hole1">
        <div class="mole"></div>
      </div>
      <div class="hole hole2">
        <div class="mole"></div>
      </div>
      <div class="hole hole3">
        <div class="mole"></div>
      </div>
      <div class="hole hole4">
        <div class="mole"></div>
      </div>
      <div class="hole hole5">
        <div class="mole"></div>
      </div>
      <div class="hole hole6">
        <div class="mole"></div>
      </div>
    </div>

    <script>
      const holes = document.querySelectorAll(".hole");
      const scoreBoard = document.querySelector(".score");
      const moles = document.querySelectorAll(".mole");
      const showScore = document.querySelector(".score");
      const showTime = document.querySelector(".time");

      const minTime = 100;
      const maxTime = 900;

      let minCounter = 0;
      let maxCounter = 0;
      let totalIterations = 0;
      let score = 0;

      // GOAL: 10 seconds of game, when you click on a mole you get 1 point
      // which hole the mole will pops in and for how long is random

      // create a timer of ten seconds
      let time = 10;

      // when the user click start, start the game and the timer
      function startGame() {
        game();
      }

      // when the timer land to 0, stop the game
      let timerId;
      let timerAdjusted = time + 1;
      function countDown() {
        console.log({ timerAdjusted });
        timerAdjusted--;

        if (timerAdjusted === 0) {
          alert("time over!");
          clearInterval(timerId);
          clearInterval(gameId);
          timerAdjusted = time;
          score = 0;
        }
        showScore.textContent = score;
        showTime.textContent = `${timerAdjusted}`;
      }

      // create a seconds counter function
      let secondsCount = 0;
      let secondsCounterId = null;
      let resetTimeoutId = null;
      function secondsCounter() {
        secondsCount++;
        console.log({ secondsCount });
      }

      // create a function which gives a random time between a min and max timeframe, and return that time
      function randomTimeFrame(min, max) {
        let randomTime = Math.floor(Math.random() * (max - min + 1) + min);

        if (randomTime < min) minCounter++;
        if (randomTime > max) maxCounter++;
        totalIterations++;
        // console.log({ randomTime, minCounter, maxCounter, totalIterations });

        return randomTime;
      }

      // create a function which starts randomTimeFrame at different times
      function randomFunctionFrequency() {
        clearInterval(secondsCounterId);
        secondsCount = 0;

        secondsCounterId = setInterval(() => {
          secondsCounter();
        }, 1000);

        const delay = randomTimeFrame(minTime, maxTime);

        clearTimeout(resetTimeoutId);
        resetTimeoutId = setTimeout(randomFunctionFrequency, delay);
        // console.log("funtion executed after", (seconds / 1000).toFixed(2));
      }

      // randomFunctionFrequency();

      // setInterval(() => randomTimeFrame(minTime, maxTime), 1000);

      // create a function which randomly select numbers from the
      // game-moles range (number of moles - example from 0 to 5)
      function pickRandomIndex(range) {
        return Math.floor(Math.random() * range.length);
      }

      // create mole function
      let checkMole = false;
      let addPointsArray = [];
      let intervalOfMole = [];

      function popMole() {
        console.log({ checkMole });
        if (checkMole) return;

        console.log("pop mole function started");
        let removeClassTimer = randomTimeFrame(minTime, maxTime);
        let randomIndex = pickRandomIndex(holes);
        let randomHole = holes[randomIndex];
        // let randomHole = holes[pickRandomIndex(holes)];
        if (!randomHole.classList.contains("up")) {
          randomHole.classList.add("up");
          checkMole = true;
          addPointsArray[randomIndex] = true;
        }

        // for each element in the range apply a random time during which the "up" class is added to the element
        // when the random time expires, remove the "up" class from the element
        intervalOfMole[randomHole] = setInterval(() => {
          clearInterval(intervalOfMole[randomHole]);
          randomHole.classList.toggle("up");
          checkMole = false;
        }, removeClassTimer);

        console.log(randomHole);
      }

      // create game function
      let gameId;
      function game() {
        score = 0;
        timerId = setInterval(countDown, 1000);
        gameId = setInterval(() => popMole(), 1000);
      }

      // if the user click on a element while it class is "up", add one point to the score
      holes.forEach((hole, index) =>
        hole.addEventListener("click", (e) => {
          if (addPointsArray[index]) {
            console.log(e.target);
            console.log("e.target");
            score++;
            showScore.textContent = score;
            // only one point is allowed for "up" mole: stop the click after one is done
            addPointsArray[index] = false;
            return;
          }
        }),
      );
    </script>
  </body>
</html>
